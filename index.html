<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SMART OUTPASS - Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            margin: 0;
            min-height: 100vh;
            background:
                linear-gradient(
                    135deg,
                    #12355b,
                    #1e6091
                );
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow:
                0 20px 50px rgba(0,0,0,0.20);
        }

        .brand {
            text-align: center;
            font-size: 30px;
            font-weight: 800;
            color: #12355b;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-label {
            font-weight: 600;
        }

        .form-control,
        .form-select {
            padding: 12px;
            border-radius: 10px;
        }

        .input-group > .form-control {
            border-radius: 10px 0 0 10px;
        }

        .input-group > .btn {
            border-radius: 0 10px 10px 0;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #12355b;
            color: white;
            font-weight: 700;
            margin-top: 10px;
            transition: 0.2s;
        }

        .login-btn:hover {
            background: #0d2945;
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .error-box {
            display: none;
        }

        .credentials {
            margin-top: 25px;
            background: #f5f7fa;
            border-radius: 12px;
            padding: 15px;
            font-size: 13px;
        }

        .credentials-title {
            color: #12355b;
            font-weight: 700;
        }

        .credential-row {
            margin-bottom: 6px;
        }

        .credential-row:last-child {
            margin-bottom: 0;
        }

        .password {
            font-family: monospace;
        }

        .server-status {
            text-align: center;
            font-size: 12px;
            margin-top: 15px;
            color: #777;
        }

    </style>

</head>

<body>

<div class="login-card">

    <div class="brand">
        SMART OUTPASS
    </div>

    <div class="subtitle">
        College Outpass Management System
    </div>


    <!-- =====================================================
         ERROR MESSAGE
    ====================================================== -->

    <div
        id="errorBox"
        class="alert alert-danger error-box"
        role="alert"
    ></div>


    <!-- =====================================================
         SUCCESS MESSAGE
    ====================================================== -->

    <div
        id="successBox"
        class="alert alert-success error-box"
        role="alert"
    ></div>


    <!-- =====================================================
         LOGIN FORM
    ====================================================== -->

    <form id="loginForm">

        <!-- ROLE -->

        <div class="mb-3">

            <label
                for="role"
                class="form-label"
            >
                Login As
            </label>

            <select
                id="role"
                class="form-select"
                required
            >

                <option value="">
                    Select Role
                </option>

                <option value="student">
                    Student
                </option>

                <option value="mentor">
                    Mentor
                </option>

                <option value="security">
                    Security
                </option>

                <option value="parent">
                    Parent
                </option>

                <option value="admin">
                    Admin
                </option>

            </select>

        </div>


        <!-- USERNAME -->

        <div class="mb-3">

            <label
                id="usernameLabel"
                for="username"
                class="form-label"
            >
                Username
            </label>

            <input
                type="text"
                id="username"
                class="form-control"
                placeholder="Enter username"
                autocomplete="username"
                required
            >

        </div>


        <!-- PASSWORD -->

        <div class="mb-3">

            <label
                for="password"
                class="form-label"
            >
                Password
            </label>

            <div class="input-group">
                <input
                    type="password"
                    id="password"
                    class="form-control"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    aria-describedby="togglePassword"
                    required
                >
                <button
                    type="button"
                    class="btn btn-outline-secondary"
                    id="togglePassword"
                    aria-controls="password"
                    aria-label="Show password"
                    aria-pressed="false"
                >
                    Show
                </button>
            </div>

        </div>


        <!-- LOGIN BUTTON -->

        <button
            type="submit"
            class="login-btn"
            id="loginButton"
        >
            Login
        </button>

    </form>


    <!-- =====================================================
         TEST ACCOUNTS
    ====================================================== -->

    <div class="credentials">

        <div class="credentials-title">
            Test Accounts
        </div>

        <hr>

        <div class="credential-row">
            <b>Student:</b>
            1 /
            <span class="password">
                Student@123
            </span>
        </div>

        <div class="credential-row">
            <b>Mentor:</b>
            11 /
            <span class="password">
                Mentor@123
            </span>
        </div>

        <div class="credential-row">
            <b>Security:</b>
            111 /
            <span class="password">
                Security@123
            </span>
        </div>

        <div class="credential-row">
            <b>Parent:</b>
            1 /
            <span class="password">
                Parent@123
            </span>
        </div>

        <div class="credential-row">
            <b>Admin:</b>
            admin /
            <span class="password">
                Admin@123
            </span>
        </div>

    </div>


    <!-- SERVER STATUS -->

    <div
        id="serverStatus"
        class="server-status"
    >
        Checking server connection...
    </div>

</div>


<script>

"use strict";


/* ==========================================================
   API
========================================================== */

const API_URL =
    "http://127.0.0.1:5000";


/* ==========================================================
   LOCAL STORAGE KEYS
========================================================== */

const TOKEN_KEY =
    "smart_outpass_token";

const USER_KEY =
    "smart_outpass_user";


/* ==========================================================
   DOM ELEMENTS
========================================================== */

const loginForm =
    document.getElementById("loginForm");

const roleInput =
    document.getElementById("role");

const usernameInput =
    document.getElementById("username");

const passwordInput =
    document.getElementById("password");

const togglePasswordButton =
    document.getElementById("togglePassword");

const usernameLabel =
    document.getElementById("usernameLabel");

const errorBox =
    document.getElementById("errorBox");

const successBox =
    document.getElementById("successBox");

const loginButton =
    document.getElementById("loginButton");

const serverStatus =
    document.getElementById("serverStatus");

togglePasswordButton.addEventListener(
    "click",
    function () {
        const isVisible =
            passwordInput.type === "text";

        passwordInput.type =
            isVisible ? "password" : "text";

        this.textContent =
            isVisible ? "Show" : "Hide";

        this.setAttribute(
            "aria-label",
            isVisible ? "Show password" : "Hide password"
        );

        this.setAttribute(
            "aria-pressed",
            String(!isVisible)
        );
    }
);


/* ==========================================================
   ROLE CHANGE
========================================================== */

roleInput.addEventListener(
    "change",
    function () {

        const role =
            this.value;

        hideMessages();


        if (role === "student") {

            usernameLabel.innerText =
                "Student Roll Number";

            usernameInput.placeholder =
                "Enter student roll number";

            usernameInput.autocomplete =
                "username";

        }

        else if (role === "mentor") {

            usernameLabel.innerText =
                "Mentor Employee ID";

            usernameInput.placeholder =
                "Enter mentor employee ID";

            usernameInput.autocomplete =
                "username";

        }

        else if (role === "security") {

            usernameLabel.innerText =
                "Security Employee ID";

            usernameInput.placeholder =
                "Enter security employee ID";

            usernameInput.autocomplete =
                "username";

        }

        else if (role === "parent") {

            usernameLabel.innerText =
                "Student Roll Number";

            usernameInput.placeholder =
                "Enter student's roll number";

            usernameInput.autocomplete =
                "username";

        }

        else {

            usernameLabel.innerText =
                "Username";

            usernameInput.placeholder =
                "Enter username";

        }

    }
);


/* ==========================================================
   FORM SUBMIT
========================================================== */

loginForm.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();

        hideMessages();


        const role =
            roleInput.value.trim();

        const username =
            usernameInput.value.trim();

        const password =
            passwordInput.value;


        /* --------------------------------------------------
           VALIDATION
        -------------------------------------------------- */

        if (!role) {

            showError(
                "Please select your role."
            );

            roleInput.focus();

            return;
        }


        if (!username) {

            showError(
                "Please enter your username."
            );

            usernameInput.focus();

            return;
        }


        if (!password) {

            showError(
                "Please enter your password."
            );

            passwordInput.focus();

            return;
        }


        /* --------------------------------------------------
           BUTTON STATE
        -------------------------------------------------- */

        loginButton.disabled = true;

        loginButton.innerText =
            "Logging in...";


        try {

            /* ----------------------------------------------
               API REQUEST
            ---------------------------------------------- */

            const response =
                await fetch(
                    API_URL + "/api/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            role: role,
                            username: username,
                            password: password
                        })
                    }
                );


            /* ----------------------------------------------
               READ RESPONSE SAFELY
            ---------------------------------------------- */

            let result = null;

            try {

                result =
                    await response.json();

            }

            catch (jsonError) {

                result = {
                    success: false,
                    message:
                        "Invalid response from server."
                };

            }


            /* ----------------------------------------------
               LOGIN FAILED
            ---------------------------------------------- */

            if (
                !response.ok ||
                !result ||
                !result.success
            ) {

                showError(
                    result &&
                    result.message
                        ? result.message
                        : "Login failed."
                );

                return;
            }


            /* ----------------------------------------------
               VERIFY TOKEN
            ---------------------------------------------- */

            if (!result.token) {

                showError(
                    "Login succeeded but no authentication token was received."
                );

                return;
            }


            /* ----------------------------------------------
               VERIFY USER
            ---------------------------------------------- */

            if (
                !result.user ||
                !result.user.role
            ) {

                showError(
                    "Login succeeded but user information was not received."
                );

                return;
            }


            /* ----------------------------------------------
               STORE TOKEN
            ---------------------------------------------- */

            localStorage.setItem(
                TOKEN_KEY,
                result.token
            );


            /* ----------------------------------------------
               STORE USER
            ---------------------------------------------- */

            localStorage.setItem(
                USER_KEY,
                JSON.stringify(
                    result.user
                )
            );


            /* ----------------------------------------------
               CHECK ROLE
            ---------------------------------------------- */

            if (
                result.user.role !== role
            ) {

                localStorage.removeItem(
                    TOKEN_KEY
                );

                localStorage.removeItem(
                    USER_KEY
                );

                showError(
                    "The server returned an unexpected user role."
                );

                return;
            }


            /* ----------------------------------------------
               SUCCESS
            ---------------------------------------------- */

            showSuccess(
                "Login successful. Redirecting..."
            );


            /* ----------------------------------------------
               REDIRECT
            ---------------------------------------------- */

            setTimeout(
                function () {

                    redirectUser(
                        result.user.role
                    );

                },
                400
            );

        }

        catch (error) {

            console.error(
                "Login error:",
                error
            );

            showError(
                "Cannot connect to Flask server. " +
                "Make sure app.py is running on " +
                API_URL + "."
            );

        }

        finally {

            loginButton.disabled =
                false;

            loginButton.innerText =
                "Login";

        }

    }
);


/* ==========================================================
   REDIRECT USER
========================================================== */

function redirectUser(role) {

    if (role === "student") {

        window.location.href =
            "student/dashboard.html";

        return;
    }


    if (role === "mentor") {

        window.location.href =
            "mentor/mdashboard.html";

        return;
    }


    if (role === "security") {

        window.location.href =
            "security/sdashboard.html";

        return;
    }


    if (role === "parent") {
        window.location.href =
            "parent/pdashboard.html";

        return;
    }


    if (role === "admin") {
        window.location.href =
            "admin/adashboard.html";

        return;
    }


    showError(
        "No dashboard is configured for this role."
    );

}


/* ==========================================================
   SHOW ERROR
========================================================== */

function showError(message) {

    successBox.style.display =
        "none";

    errorBox.innerText =
        message;

    errorBox.style.display =
        "block";

}


/* ==========================================================
   SHOW SUCCESS
========================================================== */

function showSuccess(message) {

    errorBox.style.display =
        "none";

    successBox.innerText =
        message;

    successBox.style.display =
        "block";

}


/* ==========================================================
   HIDE MESSAGES
========================================================== */

function hideMessages() {

    errorBox.style.display =
        "none";

    successBox.style.display =
        "none";

}


/* ==========================================================
   CHECK SERVER
========================================================== */

async function checkServer() {

    try {

        const response =
            await fetch(
                API_URL + "/api/health",
                {
                    method: "GET"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Server returned an error."
            );

        }


        const result =
            await response.json();


        if (
            result.success &&
            result.database === "connected"
        ) {

            serverStatus.innerText =
                "● Server connected";

        }

        else {

            serverStatus.innerText =
                "● Server connected, database unavailable";

        }

    }

    catch (error) {

        serverStatus.innerText =
            "● Flask server is offline";

    }

}


/* ==========================================================
   CLEAR INVALID OLD LOGIN
========================================================== */

function clearInvalidStoredLogin() {

    const token =
        localStorage.getItem(
            TOKEN_KEY
        );

    const user =
        localStorage.getItem(
            USER_KEY
        );


    /*
     * Do not automatically redirect based only on
     * localStorage. The backend token is the actual
     * authentication credential.
     */

    if (!token || !user) {

        localStorage.removeItem(
            TOKEN_KEY
        );

        localStorage.removeItem(
            USER_KEY
        );

    }

}


/* ==========================================================
   INITIALIZATION
========================================================== */

clearInvalidStoredLogin();

checkServer();

</script>

</body>
</html>
