<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Notifications - Smart Digital Outpass</title>

    <!-- Bootstrap -->

        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background-color: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        /* ================= NAVBAR ================= */

        .navbar-custom {
            background-color: #12355b;
        }

        .navbar-brand {
            color: white !important;
            font-weight: bold;
        }

        .nav-link {
            color: white !important;
        }

        /* ================= PAGE ================= */

        .page-container {
            max-width: 900px;
            margin: 35px auto;
        }

        .page-header {
            background-color: white;
            padding: 25px 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        .page-title {
            color: #12355b;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .page-subtitle {
            color: #777;
            margin-bottom: 0;
        }

        /* ================= ACTIONS ================= */

        .notification-actions {
            background-color: white;
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        /* ================= NOTIFICATION ================= */

        .notification-card {
            background-color: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.07);
            border-left: 5px solid #12355b;
            transition: 0.2s;
        }

        .notification-card:hover {
            transform: translateY(-2px);
        }

        .notification-card.unread {
            background-color: #f8fbff;
        }

        .notification-icon {
            width: 45px;
            height: 45px;
            min-width: 45px;
            border-radius: 50%;
            background-color: #e8f0f8;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 21px;
        }

        .notification-title {
            font-weight: bold;
            color: #12355b;
            margin-bottom: 5px;
        }

        .notification-message {
            color: #555;
            margin-bottom: 6px;
        }

        .notification-time {
            font-size: 12px;
            color: #888;
        }

        .notification-source {
            display: inline-block;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 20px;
            background-color: #e9ecef;
            color: #555;
            margin-top: 5px;
        }

        .unread-dot {
            width: 9px;
            height: 9px;
            background-color: #dc3545;
            border-radius: 50%;
            display: inline-block;
            margin-left: 5px;
        }

        /* ================= LOADING ================= */

        #loadingMessage {
            background-color: white;
            padding: 45px;
            text-align: center;
            border-radius: 15px;
            color: #777;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        /* ================= EMPTY ================= */

        #emptyMessage {
            display: none;
            background-color: white;
            padding: 50px;
            text-align: center;
            border-radius: 15px;
            color: #777;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        /* ================= ERROR ================= */

        #errorMessage {
            display: none;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 576px) {

            .page-container {
                margin: 20px 10px;
            }

            .notification-card {
                padding: 15px;
            }

            .page-header {
                padding: 20px;
            }

            .notification-actions {
                padding: 12px;
            }

        }

    </style>

</head>

<!-- =====================================================

<div class="container page-container">


    <!-- ================= HEADER ================= -->

    <div class="page-header">

        <div class="d-flex justify-content-between align-items-center">

            <div>

                <h2 class="page-title">

                </p>

<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<script>

    // ==================================================
    // CONFIGURATION
    // ==================================================

    const API_URL = "http://127.0.0.1:5000";

    const TOKEN_KEY = "smart_outpass_token";

    const USER_KEY = "smart_outpass_user";

    const READ_KEY = "smart_outpass_read_notifications";


    // ==================================================
    // ELEMENTS
    // ==================================================

    const notificationList =
        document.getElementById("notificationList");

    const emptyMessage =
        document.getElementById("emptyMessage");

    const loadingMessage =
        document.getElementById("loadingMessage");

    const errorMessage =
        document.getElementById("errorMessage");

    const markAllButton =
        document.getElementById("markAllButton");

    const refreshButton =
        document.getElementById("refreshButton");

    const unreadCount =
        document.getElementById("unreadCount");


    // ==================================================
    // AUTHENTICATION
    // ==================================================

    function getToken() {

        return localStorage.getItem(
            TOKEN_KEY
        );

    }


    function getCurrentUser() {

        try {

            return JSON.parse(
                localStorage.getItem(USER_KEY)
            ) || {};

        }
        catch (error) {

            console.error(
                "Unable to read current user:",
                error
            );

            return {};

        }

    }


    function getAuthHeaders() {

        const token =
            getToken();

        if (!token) {

            return {};

        }

        return {
            "Authorization":
                "Bearer " + token,

            "Content-Type":
                "application/json"
        };

    }


    // ==================================================
    // CHECK LOGIN
    // ==================================================

    function checkAuthentication() {

        const token =
            getToken();

        if (!token) {

            window.location.href =
                "../index.html";

            return false;

        }

        const user =
            getCurrentUser();

        if (
            user.role &&
            user.role !== "student"
        ) {

            window.location.href =
                "../index.html";

            return false;

        }

        return true;

    }


    // ==================================================
    // READ / UNREAD STORAGE
    //
    // Notification data comes from Flask/MySQL.
    // Only read/unread UI state is stored locally.
    // ==================================================

    function getReadNotifications() {

        try {

            const stored =
                localStorage.getItem(
                    READ_KEY
                );

            if (!stored) {

                return [];

            }

            const parsed =
                JSON.parse(stored);

            return Array.isArray(parsed)
                ? parsed
                : [];

        }
        catch (error) {

            return [];

        }

    }


    function saveReadNotifications(
        notifications
    ) {

        localStorage.setItem(
            READ_KEY,
            JSON.stringify(
                notifications
            )
        );

    }


    function markNotificationAsRead(
        notificationId
    ) {

        if (!notificationId) {

            return;

        }

        const readNotifications =
            getReadNotifications();

        if (
            !readNotifications.includes(
                notificationId
            )
        ) {

            readNotifications.push(
                notificationId
            );

            saveReadNotifications(
                readNotifications
            );

        }

    }


    // ==================================================
    // ESCAPE HTML
    // ==================================================

    function escapeHTML(value) {

        if (
            value === undefined ||
            value === null
        ) {

            return "";

        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    // ==================================================
    // FORMAT DATE/TIME
    // ==================================================

    function formatTime(timestamp) {

        if (!timestamp) {

            return "Time not available";

        }

        const date =
            new Date(timestamp);

        if (
            isNaN(
                date.getTime()
            )
        ) {

            return "Time not available";

        }

        return date.toLocaleString();

    }


    // ==================================================
    // NORMALIZE VALUE
    // ==================================================

    function normalizeStatus(value) {

        return String(
            value || ""
        )
            .trim()
            .toLowerCase();

    }


    // ==================================================
    // ADD NOTIFICATION
    // ==================================================

    function addNotification(
        notifications,
        notification
    ) {

        if (
            !notification ||
            !notification.id
        ) {

            return;

        }

        notifications.push(
            notification
        );

    }


    // ==================================================
    // CREATE OUTPASS NOTIFICATIONS
    // ==================================================

    function createOutpassNotifications(
        request,
        notifications
    ) {

        const outpassId =
            request.outpass_id;

        if (!outpassId) {

            return;

        }


        // ----------------------------------------------
        // REQUEST SUBMITTED
        // ----------------------------------------------

        addNotification(
            notifications,
            {

                id:
                    outpassId +
                    "-submitted",

                icon:
                    "📝",

                title:
                    "Outpass Request Submitted",

                message:
                    "Your outpass request " +
                    "<strong>" +
                    escapeHTML(outpassId) +
                    "</strong> has been submitted successfully.",

                timestamp:
                    request.submitted_at,

                link:
                    "my-outpasses.html?outpass_id=" +
                    encodeURIComponent(outpassId),

                source:
                    "Outpass"

            }
        );


        // ----------------------------------------------
        // PARENT APPROVED
        // ----------------------------------------------

        if (
            normalizeStatus(
                request.parent_status
            ) === "approved"
        ) {

            addNotification(
                notifications,
                {

                    id:
                        outpassId +
                        "-parent-approved",

                    icon:
                        "✅",

                    title:
                        "Parent Approval Received",

                    message:
                        "Your parent has approved outpass " +
                        "<strong>" +
                        escapeHTML(outpassId) +
                        "</strong>.",

                    timestamp:
                        request.parent_approved_at ||
                        request.submitted_at,

                    link:
                        "my-outpasses.html?outpass_id=" +
                        encodeURIComponent(outpassId),

                    source:
                        "Parent Approval"

                }
            );

        }


        // ----------------------------------------------
        // PARENT REJECTED
        // ----------------------------------------------

        if (
            normalizeStatus(
                request.parent_status
            ) === "rejected"
        ) {

            addNotification(
                notifications,
                {

                    id:
                        outpassId +
                        "-parent-rejected",

                    icon:
                        "❌",

                    title:
                        "Parent Approval Rejected",

                    message:
                        "Your parent has rejected outpass " +
                        "<strong>" +
                        escapeHTML(outpassId) +
                        "</strong>.",

                    timestamp:
                        request.parent_rejected_at ||
                        request.submitted_at,

                    link:
                        "my-outpasses.html?outpass_id=" +
                        encodeURIComponent(outpassId),

                    source:
                        "Parent Approval"

                }
            );

        }


        // ----------------------------------------------
        // MENTOR APPROVED
        // ----------------------------------------------

        if (
            normalizeStatus(
                request.mentor_status
            ) === "approved"
        ) {

            addNotification(
                notifications,
                {

                    id:
                        outpassId +
                        "-mentor-approved",

                    icon:
                        "👨‍🏫",

                    title:
                        "Mentor Approval Received",

                    message:
                        "Your mentor has approved outpass " +
                        "<strong>" +
                        escapeHTML(outpassId) +
                        "</strong>.",

                    timestamp:
                        request.mentor_approved_at ||
                        request.submitted_at,

                    link:
                        "my-outpasses.html?outpass_id=" +
                        encodeURIComponent(outpassId),

                    source:
                        "Mentor Approval"

                }
            );

        }


        // ----------------------------------------------
        // MENTOR REJECTED
        // ----------------------------------------------

        if (
            normalizeStatus(
                request.mentor_status
            ) === "rejected"
        ) {

            let rejectionText =
                "Your mentor has rejected outpass " +
                "<strong>" +
                escapeHTML(outpassId) +
                "</strong>.";

            if (
                request.mentor_rejection_reason
            ) {

                rejectionText +=
                    "<br><small>" +
                    "Reason: " +
                    escapeHTML(
                        request.mentor_rejection_reason
                    ) +
                    "</small>";

            }

            addNotification(
                notifications,
                {

                    id:
                        outpassId +
                        "-mentor-rejected",

                    icon:
                        "❌",

                    title:
                        "Mentor Approval Rejected",

                    message:
                        rejectionText,

                    timestamp:
                        request.mentor_rejected_at ||
                        request.submitted_at,

                    link:
                        "my-outpasses.html?outpass_id=" +
                        encodeURIComponent(outpassId),

                    source:
                        "Mentor Approval"

                }
            );

        }


        // ----------------------------------------------
        // SECURITY EXIT
        // ----------------------------------------------

        const securityStatus =
            normalizeStatus(
                request.security_status
            );

        if (
            securityStatus === "outside" ||
            securityStatus.includes("exited")
        ) {

            addNotification(
                notifications,
                {

                    id:
                        outpassId +
                        "-exited",

                    icon:
                        "🚪",

                    title:
                        "Exit Recorded",

                    message:
                        "Your exit for outpass " +
                        "<strong>" +
                        escapeHTML(outpassId) +
                        "</strong> has been recorded by security.",

                    timestamp:
                        request.actual_exit_time ||
                        request.submitted_at,

                    link:
                        "pass.html?outpass_id=" +
                        encodeURIComponent(outpassId),

                    source:
                        "Security"

                }
            );

        }


        // ----------------------------------------------
        // SECURITY RETURN
        // ----------------------------------------------

        if (
            securityStatus === "returned" ||
            securityStatus.includes("returned")
        ) {

            addNotification(
                notifications,
                {

                    id:
                        outpassId +
                        "-returned",

                    icon:
                        "🏫",

                    title:
                        "Return Recorded",

                    message:
                        "Your return to campus for outpass " +
                        "<strong>" +
                        escapeHTML(outpassId) +
                        "</strong> has been recorded successfully.",

                    timestamp:
                        request.actual_return_time ||
                        request.submitted_at,

                    link:
                        "pass.html?outpass_id=" +
                        encodeURIComponent(outpassId),

                    source:
                        "Security"

                }
            );

        }

    }


    // ==================================================
    // CREATE EMAIL NOTIFICATIONS
    // ==================================================

    function createEmailNotifications(
        emailRecords,
        notifications
    ) {

        if (
            !Array.isArray(emailRecords)
        ) {

            return;

        }

        emailRecords.forEach(
            function(record) {

                if (!record.id) {

                    return;

                }

                const status =
                    normalizeStatus(
                        record.status
                    );

                let icon =
                    "📧";

                const eventTitles = {
                    STUDENT_OUTPASS_SUBMITTED:
                        "Outpass Submitted",
                    PARENT_APPROVED:
                        "Parent Approval Completed",
                    MENTOR_APPROVED:
                        "Mentor Approved",
                    MENTOR_REJECTED:
                        "Mentor Rejected",
                    SECURITY_EXIT:
                        "Exit Recorded",
                    SECURITY_RETURN:
                        "Return Recorded"
                };

                let title =
                    eventTitles[
                        String(record.notification_type || "").toUpperCase()
                    ] ||
                    record.notification_type ||
                    "Email Notification";


                if (
                    status === "sent"
                ) {

                    icon = "📨";

                }
                else if (
                    status === "failed"
                ) {

                    icon = "⚠️";

                }


                if (
                    String(
                        record.notification_type || ""
                    ).toUpperCase() === "PARENT_OTP"
                ) {

                    title =
                        "Parent OTP Email";

                }


                let message =
                    "An email notification was processed.";

                if (record.message) {

                    message =
                        escapeHTML(
                            record.message
                        ).replace(/\n/g, "<br>");

                }
                else if (record.subject) {

                    message = escapeHTML(record.subject);

                }


                if (
                    status === "failed" &&
                    record.error_message
                ) {

                    message +=
                        "<br><small>" +
                        "Email delivery issue: " +
                        escapeHTML(
                            record.error_message
                        ) +
                        "</small>";

                }


                addNotification(
                    notifications,
                    {

                        id:
                            "email-" +
                            String(record.id),

                        icon:
                            icon,

                        title:
                            title,

                        message:
                            message,

                        timestamp:
                            record.sent_at ||
                            record.created_at,

                        link:
                            record.outpass_id
                                ? "my-outpasses.html?outpass_id=" +
                                  encodeURIComponent(
                                      record.outpass_id
                                  )
                                : "notifications.html",

                        source:
                            "Email"

                    }
                );

            }
        );

    }


    // ==================================================
    // CREATE NOTIFICATION CARD
    // ==================================================

    function createNotificationCard(
        notification
    ) {

        const readNotifications =
            getReadNotifications();

        const isRead =
            readNotifications.includes(
                notification.id
            );


        const card =
            document.createElement("div");


        card.className =
            "notification-card" +
            (
                isRead
                    ? ""
                    : " unread"
            );


        card.dataset.notificationId =
            notification.id;


        const safeLink =
            notification.link ||
            "my-outpasses.html";


        card.innerHTML = `

            <div class="d-flex gap-3">

                <div class="notification-icon">
                    ${notification.icon || "🔔"}
                </div>

                <div class="flex-grow-1">

                    <div class="notification-title">

                        ${escapeHTML(
                            notification.title
                        )}

                        ${
                            !isRead
                                ? '<span class="unread-dot"></span>'
                                : ''
                        }

                    </div>

                    <div class="notification-message">
                        ${notification.message || ""}
                    </div>

                    <div class="notification-time">
                        ${escapeHTML(
                            formatTime(
                                notification.timestamp
                            )
                        )}
                    </div>

                    <span class="notification-source">
                        ${escapeHTML(
                            notification.source ||
                            "System"
                        )}
                    </span>

                    <br>

                    <a
                        href="${escapeHTML(safeLink)}"
                        class="btn btn-sm btn-outline-primary mt-2"
                    >
                        View
                    </a>

                </div>

            </div>

        `;


        // ----------------------------------------------
        // MARK AS READ WHEN CLICKED
        // ----------------------------------------------

        card.addEventListener(
            "click",
            function(event) {

                if (
                    event.target.closest("a")
                ) {

                    return;

                }


                markNotificationAsRead(
                    notification.id
                );


                card.classList.remove(
                    "unread"
                );


                const dot =
                    card.querySelector(
                        ".unread-dot"
                    );


                if (dot) {

                    dot.remove();

                }


                updateUnreadCount();

            }
        );


        notificationList.appendChild(
            card
        );

    }


    // ==================================================
    // UPDATE UNREAD COUNT
    // ==================================================

    function updateUnreadCount() {

        const cards =
            document.querySelectorAll(
                ".notification-card"
            );


        let count = 0;


        cards.forEach(
            function(card) {

                if (
                    card.classList.contains(
                        "unread"
                    )
                ) {

                    count++;

                }

            }
        );


        unreadCount.textContent =
            count +
            (
                count === 1
                    ? " unread"
                    : " unread"
            );

    }


    // ==================================================
    // API GET
    // ==================================================

    async function apiGet(
        endpoint
    ) {

        const response =
            await fetch(
                API_URL + endpoint,
                {
                    method: "GET",
                    headers:
                        getAuthHeaders()
                }
            );


        let result;


        try {

            result =
                await response.json();

        }
        catch (error) {

            throw new Error(
                "Invalid response received from the server."
            );

        }


        // ----------------------------------------------
        // SESSION EXPIRED
        // ----------------------------------------------

        if (
            response.status === 401 ||
            response.status === 403
        ) {

            localStorage.removeItem(
                TOKEN_KEY
            );

            localStorage.removeItem(
                USER_KEY
            );

            window.location.href =
                "../index.html";

            throw new Error(
                "Your session has expired. Please login again."
            );

        }


        if (
            !response.ok ||
            !result.success
        ) {

            throw new Error(
                result.message ||
                "Unable to load data from server."
            );

        }


        return result;

    }


    // ==================================================
    // LOAD OUTPASSES
    // ==================================================

    async function loadBackendOutpasses() {

        const result =
            await apiGet(
                "/api/outpasses"
            );


        return Array.isArray(
            result.requests
        )
            ? result.requests
            : [];

    }


    // ==================================================
    // LOAD EMAIL NOTIFICATION HISTORY
    // ==================================================

    async function loadBackendNotifications() {

        const result =
            await apiGet(
                "/api/notifications"
            );


        return Array.isArray(
            result.notifications
        )
            ? result.notifications
            : [];

    }


    // ==================================================
    // LOAD ALL NOTIFICATIONS
    // ==================================================

    async function loadNotifications() {

        if (
            !checkAuthentication()
        ) {

            return;

        }


        loadingMessage.style.display =
            "block";

        errorMessage.style.display =
            "none";

        emptyMessage.style.display =
            "none";


        notificationList.innerHTML =
            "";


        try {

            /*
             * The following data comes from Flask/MySQL:
             *
             * 1. /api/outpasses
             * 2. /api/notifications
             */

            const results =
                await Promise.all([
                    loadBackendOutpasses(),
                    loadBackendNotifications()
                ]);


            const outpasses =
                results[0];

            const emailNotifications =
                results[1];


            const notifications = [];


            // ------------------------------------------
            // OUTPASS EVENTS
            // ------------------------------------------

            outpasses.forEach(
                function(request) {

                    createOutpassNotifications(
                        request,
                        notifications
                    );

                }
            );


            // ------------------------------------------
            // EMAIL EVENTS
            // ------------------------------------------

            createEmailNotifications(
                emailNotifications,
                notifications
            );


            // ------------------------------------------
            // REMOVE DUPLICATES
            // ------------------------------------------

            const uniqueNotifications =
                Array.from(
                    new Map(
                        notifications.map(
                            function(item) {

                                return [
                                    item.id,
                                    item
                                ];

                            }
                        )
                    ).values()
                );


            // ------------------------------------------
            // SORT NEWEST FIRST
            // ------------------------------------------

            uniqueNotifications.sort(
                function(a, b) {

                    const dateA =
                        new Date(
                            a.timestamp || 0
                        ).getTime();

                    const dateB =
                        new Date(
                            b.timestamp || 0
                        ).getTime();

                    return dateB - dateA;

                }
            );


            loadingMessage.style.display =
                "none";


            // ------------------------------------------
            // EMPTY
            // ------------------------------------------

            if (
                uniqueNotifications.length === 0
            ) {

                emptyMessage.style.display =
                    "block";

                updateUnreadCount();

                return;

            }


            // ------------------------------------------
            // DISPLAY
            // ------------------------------------------

            uniqueNotifications.forEach(
                function(notification) {

                    createNotificationCard(
                        notification
                    );

                }
            );


            updateUnreadCount();

        }
        catch (error) {

            console.error(
                "Notification loading error:",
                error
            );


            loadingMessage.style.display =
                "none";


            errorMessage.style.display =
                "block";


            errorMessage.innerHTML = `

                <strong>
                    Unable to load notifications.
                </strong>

                <br>

                ${escapeHTML(
                    error.message
                )}

                <br><br>

                <button
                    type="button"
                    class="btn btn-sm btn-danger"
                    onclick="loadNotifications()"
                >
                    Try Again
                </button>

            `;

        }

    }


    // ==================================================
    // MARK ALL AS READ
    // ==================================================

    markAllButton.addEventListener(
        "click",
        function() {

            const cards =
                document.querySelectorAll(
                    ".notification-card"
                );


            const readNotifications =
                getReadNotifications();


            cards.forEach(
                function(card) {

                    const id =
                        card.dataset.notificationId;


                    if (
                        id &&
                        !readNotifications.includes(id)
                    ) {

                        readNotifications.push(
                            id
                        );

                    }


                    card.classList.remove(
                        "unread"
                    );


                    const dot =
                        card.querySelector(
                            ".unread-dot"
                        );


                    if (dot) {

                        dot.remove();

                    }

                }
            );


            saveReadNotifications(
                readNotifications
            );


            updateUnreadCount();

        }
    );


    // ==================================================
    // REFRESH BUTTON
    // ==================================================

    refreshButton.addEventListener(
        "click",
        function() {

            loadNotifications();

        }
    );


    // ==================================================
    // INITIAL LOAD
    // ==================================================

    loadNotifications();


    // ==================================================
    // AUTO REFRESH
    // ==================================================

    setInterval(
        function() {

            loadNotifications();

        },
        10000
    );

</script>
