<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART OUTPASS - Mentor History</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --page-bg: #f5f7fb;
        }

        body {
            background: var(--page-bg);
            color: #212529;
            min-height: 100vh;
        }

        .navbar-brand {
            font-weight: 700;
        }

        .nav-link {
            border-radius: .5rem;
            margin: 0 .1rem;
        }

        .nav-link:hover,
        .nav-link.active {
            background: rgba(255,255,255,.12);
        }

        .page-header {
            background: linear-gradient(135deg, #0d6efd, #084298);
            color: #fff;
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 .5rem 1.5rem rgba(13,110,253,.15);
        }

        .mentor-meta {
            opacity: .92;
        }

        .stat-card,
        .history-card,
        .filter-card {
            border: 0;
            border-radius: 1rem;
            box-shadow: 0 .25rem 1rem rgba(0,0,0,.06);
        }

        .stat-card {
            height: 100%;
        }

        .stat-number {
            font-size: 1.65rem;
            font-weight: 700;
            line-height: 1;
        }

        .history-card {
            transition: transform .15s ease, box-shadow .15s ease;
        }

        .history-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 .5rem 1.4rem rgba(0,0,0,.09);
        }

        .status-badge {
            font-size: .8rem;
            font-weight: 600;
        }

        .info-label {
            color: #6c757d;
            font-size: .78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .04em;
            margin-bottom: .15rem;
        }

        .info-value {
            word-break: break-word;
        }

        .reason-box,
        .rejection-box,
        .otp-box {
            border-radius: .75rem;
            padding: .85rem 1rem;
        }

        .reason-box {
            background: #f8f9fa;
        }

        .rejection-box {
            background: #fff5f5;
            border: 1px solid #f1c2c2;
        }

        .otp-box {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
        }

        .empty-state {
            padding: 3rem 1rem;
            text-align: center;
            color: #6c757d;
        }

        .spinner-wrap {
            min-height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .small-muted {
            font-size: .85rem;
            color: #6c757d;
        }

        @media (max-width: 575.98px) {
            .page-header {
                padding: 1.15rem;
            }
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">

        <a class="navbar-brand" href="mdashboard.html">
            <i class="bi bi-shield-check me-2"></i>
            SMART OUTPASS
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNav"
                aria-controls="mainNav"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">

            <ul class="navbar-nav ms-auto align-items-lg-center">

                <li class="nav-item">
                    <a class="nav-link" href="mdashboard.html">
                        <i class="bi bi-speedometer2 me-1"></i>
                        Dashboard
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="outpass-requests.html">
                        <i class="bi bi-inbox me-1"></i>
                        Requests
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active"
                      href="mhistory.html"
                       aria-current="page">
                        <i class="bi bi-clock-history me-1"></i>
                        History
                    </a>
                </li>

                <li class="nav-item ms-lg-2 mt-2 mt-lg-0">
                    <button type="button"
                            class="btn btn-light btn-sm"
                            id="logoutBtn">
                        <i class="bi bi-box-arrow-right me-1"></i>
                        Logout
                    </button>
                </li>

            </ul>
        </div>
    </div>
</nav>


<main class="container py-4">

    <!-- PAGE HEADER -->
    <section class="page-header mb-4">

        <div class="row align-items-center g-3">

            <div class="col-lg-8">

                <h1 class="h3 mb-2">
                    <i class="bi bi-clock-history me-2"></i>
                    Mentor Outpass History
                </h1>

                <div class="mentor-meta">

                    <span id="mentorName">
                        Loading mentor...
                    </span>

                    <span class="mx-2">•</span>

                    <span id="mentorEmployeeId">
                        Employee ID: —
                    </span>

                </div>
            </div>

            <div class="col-lg-4 text-lg-end">

                <button type="button"
                        class="btn btn-light"
                        id="refreshBtn">

                    <i class="bi bi-arrow-clockwise me-1"></i>
                    Refresh

                </button>

            </div>

        </div>

    </section>


    <!-- STATISTICS -->
    <section class="row g-3 mb-4">

        <div class="col-6 col-lg-3">

            <div class="card stat-card">

                <div class="card-body">

                    <div class="small-muted mb-2">
                        Total Decisions
                    </div>

                    <div class="stat-number"
                         id="totalCount">
                        0
                    </div>

                </div>

            </div>

        </div>


        <div class="col-6 col-lg-3">

            <div class="card stat-card">

                <div class="card-body">

                    <div class="small-muted mb-2">
                        Approved
                    </div>

                    <div class="stat-number text-success"
                         id="approvedCount">
                        0
                    </div>

                </div>

            </div>

        </div>


        <div class="col-6 col-lg-3">

            <div class="card stat-card">

                <div class="card-body">

                    <div class="small-muted mb-2">
                        Rejected
                    </div>

                    <div class="stat-number text-danger"
                         id="rejectedCount">
                        0
                    </div>

                </div>

            </div>

        </div>


        <div class="col-6 col-lg-3">

            <div class="card stat-card">

                <div class="card-body">

                    <div class="small-muted mb-2">
                        Shown
                    </div>

                    <div class="stat-number text-primary"
                         id="shownCount">
                        0
                    </div>

                </div>

            </div>

        </div>

    </section>


    <!-- FILTERS -->
    <section class="card filter-card mb-4">

        <div class="card-body">

            <div class="row g-3 align-items-end">

                <div class="col-md-4">

                    <label for="statusFilter"
                           class="form-label fw-semibold">
                        Status
                    </label>

                    <select id="statusFilter"
                            class="form-select">

                        <option value="all">
                            All decisions
                        </option>

                        <option value="approved">
                            Approved
                        </option>

                        <option value="rejected">
                            Rejected
                        </option>

                    </select>

                </div>


                <div class="col-md-5">

                    <label for="searchInput"
                           class="form-label fw-semibold">
                        Search
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-search"></i>
                        </span>

                        <input type="search"
                               id="searchInput"
                               class="form-control"
                               placeholder="Outpass ID, student, roll number, destination...">

                    </div>

                </div>


                <div class="col-md-3">

                    <button type="button"
                            class="btn btn-outline-secondary w-100"
                            id="clearFiltersBtn">

                        <i class="bi bi-x-circle me-1"></i>
                        Clear Filters

                    </button>

                </div>

            </div>

        </div>

    </section>


    <!-- ALERT -->
    <div id="alertContainer"></div>


    <!-- LOADING -->
    <section id="loadingState"
             class="card history-card">

        <div class="card-body spinner-wrap">

            <div class="text-center">

                <div class="spinner-border text-primary mb-3"
                     role="status"
                     aria-hidden="true">
                </div>

                <div class="fw-semibold">
                    Loading history...
                </div>

            </div>

        </div>

    </section>


    <!-- HISTORY -->
    <section id="historyContainer"
             class="row g-3 d-none"
             aria-live="polite">
    </section>


    <!-- EMPTY -->
    <section id="emptyState"
             class="card history-card d-none">

        <div class="card-body empty-state">

            <i class="bi bi-inbox fs-1 d-block mb-3"></i>

            <h2 class="h5">
                No history found
            </h2>

            <p class="mb-0"
               id="emptyMessage">
                There are no approved or rejected outpasses matching your filters.
            </p>

        </div>

    </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


<script>

(() => {

    "use strict";


    /* =========================================================
       CONFIGURATION
       ========================================================= */

    const API_URL = "http://127.0.0.1:5000";

    const TOKEN_KEY = "smart_outpass_token";
    const USER_KEY = "smart_outpass_user";


    /* =========================================================
       DOM ELEMENTS
       ========================================================= */

    const elements = {

        mentorName:
            document.getElementById("mentorName"),

        mentorEmployeeId:
            document.getElementById("mentorEmployeeId"),

        totalCount:
            document.getElementById("totalCount"),

        approvedCount:
            document.getElementById("approvedCount"),

        rejectedCount:
            document.getElementById("rejectedCount"),

        shownCount:
            document.getElementById("shownCount"),

        statusFilter:
            document.getElementById("statusFilter"),

        searchInput:
            document.getElementById("searchInput"),

        clearFiltersBtn:
            document.getElementById("clearFiltersBtn"),

        refreshBtn:
            document.getElementById("refreshBtn"),

        logoutBtn:
            document.getElementById("logoutBtn"),

        loadingState:
            document.getElementById("loadingState"),

        historyContainer:
            document.getElementById("historyContainer"),

        emptyState:
            document.getElementById("emptyState"),

        emptyMessage:
            document.getElementById("emptyMessage"),

        alertContainer:
            document.getElementById("alertContainer")

    };


    let currentUser = null;

    let allHistory = [];


    /* =========================================================
       HELPER FUNCTIONS
       ========================================================= */

    function normalize(value) {

        return String(value ?? "").trim();

    }


    function escapeHtml(value) {

        return normalize(value)

            .replace(/&/g, "&amp;")

            .replace(/</g, "&lt;")

            .replace(/>/g, "&gt;")

            .replace(/"/g, "&quot;")

            .replace(/'/g, "&#039;");

    }


    function getStoredUser() {

        try {

            const raw =
                localStorage.getItem(USER_KEY);

            return raw
                ? JSON.parse(raw)
                : null;

        } catch (error) {

            console.error(
                "Invalid stored user:",
                error
            );

            return null;
        }

    }


    function getToken() {

        return normalize(
            localStorage.getItem(TOKEN_KEY)
        );

    }


    function logout() {

        localStorage.removeItem(TOKEN_KEY);

        localStorage.removeItem(USER_KEY);

        window.location.href = "../index.html";

    }


    function showAlert(message, type = "danger") {

        const icon =
            type === "success"
                ? "bi-check-circle"
                : "bi-exclamation-triangle";

        elements.alertContainer.innerHTML = `

            <div class="alert alert-${escapeHtml(type)}
                 alert-dismissible fade show"
                 role="alert">

                <i class="bi ${icon} me-2"></i>

                ${escapeHtml(message)}

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"
                        aria-label="Close">
                </button>

            </div>
        `;

    }


    function hideAlert() {

        elements.alertContainer.innerHTML = "";

    }


    /* =========================================================
       DATE / TIME FORMATTERS
       ========================================================= */

    function formatDate(value) {

        if (!value) {
            return "—";
        }

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
            return normalize(value) || "—";
        }

        return new Intl.DateTimeFormat(
            undefined,
            {
                day: "2-digit",
                month: "short",
                year: "numeric"
            }
        ).format(date);

    }


    function formatDateTime(value) {

        if (!value) {
            return "—";
        }

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
            return normalize(value) || "—";
        }

        return new Intl.DateTimeFormat(
            undefined,
            {
                day: "2-digit",
                month: "short",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit"
            }
        ).format(date);

    }


    function formatTime(value) {

        if (!value) {
            return "—";
        }

        const raw = normalize(value);


        if (/^\d{2}:\d{2}(:\d{2})?$/.test(raw)) {

            const parts = raw.split(":");

            const date = new Date();

            date.setHours(
                Number(parts[0]),
                Number(parts[1]),
                Number(parts[2] || 0),
                0
            );

            return new Intl.DateTimeFormat(
                undefined,
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            ).format(date);

        }


        const date = new Date(raw);

        if (!Number.isNaN(date.getTime())) {

            return new Intl.DateTimeFormat(
                undefined,
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            ).format(date);

        }


        return raw;

    }


    /* =========================================================
       USER / ROLE
       ========================================================= */

    function getRole(user) {

        return normalize(
            user?.role
        ).toLowerCase();

    }


    /* =========================================================
       API RESPONSE HANDLING
       ========================================================= */

    function getHistoryArray(result) {

        if (Array.isArray(result)) {
            return result;
        }

        if (Array.isArray(result?.requests)) {
            return result.requests;
        }

        if (Array.isArray(result?.outpasses)) {
            return result.outpasses;
        }

        if (Array.isArray(result?.result)) {
            return result.result;
        }

        if (Array.isArray(result?.data)) {
            return result.data;
        }

        return [];

    }


    function getMentorStatus(item) {

        return normalize(
            item?.mentor_status
        ).toLowerCase();

    }


    function isApproved(item) {

        return getMentorStatus(item) === "approved";

    }


    function isRejected(item) {

        return getMentorStatus(item) === "rejected";

    }


    /* =========================================================
       NORMALIZE HISTORY
       ========================================================= */

    function normalizeHistory(items) {

        return items

            .filter(item =>
                isApproved(item) ||
                isRejected(item)
            )

            .sort((a, b) => {

                const da =
                    new Date(
                        a?.submitted_at || 0
                    ).getTime();

                const db =
                    new Date(
                        b?.submitted_at || 0
                    ).getTime();

                return db - da;

            });

    }


    /* =========================================================
       SEARCH
       ========================================================= */

    function searchableText(item) {

        return [

            item?.outpass_id,

            item?.student_name,

            item?.roll_number,

            item?.year,

            item?.destination,

            item?.reason,

            item?.mentor_status,

            item?.mentor_rejection_reason

        ]

        .map(normalize)

        .join(" ")

        .toLowerCase();

    }


    /* =========================================================
       STATISTICS
       ========================================================= */

    function renderStats(filteredItems = allHistory) {

        const approved =
            allHistory.filter(isApproved).length;

        const rejected =
            allHistory.filter(isRejected).length;


        elements.totalCount.textContent =
            String(allHistory.length);

        elements.approvedCount.textContent =
            String(approved);

        elements.rejectedCount.textContent =
            String(rejected);

        elements.shownCount.textContent =
            String(filteredItems.length);

    }


    /* =========================================================
       INFO BLOCK
       ========================================================= */

    function infoBlock(label, value) {

        return `

            <div class="col-6 col-lg-4">

                <div class="info-label">
                    ${escapeHtml(label)}
                </div>

                <div class="info-value">
                    ${escapeHtml(value || "—")}
                </div>

            </div>

        `;

    }


    /* =========================================================
       STATUS BADGE
       ========================================================= */

    function statusMarkup(item) {

        if (isApproved(item)) {

            return `

                <span class="badge text-bg-success status-badge">

                    <i class="bi bi-check-circle me-1"></i>

                    Approved

                </span>

            `;

        }


        return `

            <span class="badge text-bg-danger status-badge">

                <i class="bi bi-x-circle me-1"></i>

                Rejected

            </span>

        `;

    }


    /* =========================================================
       HISTORY CARD
       ========================================================= */

    function renderCard(item) {

        const approved =
            isApproved(item);


        const decisionTime =
            approved
                ? item?.mentor_approved_at
                : item?.mentor_rejected_at;


        const parentVerifiedAt =

            item?.parent_verified_at ||

            item?.parent_approved_at ||

            item?.parent_otp_verified_at ||

            item?.otp_verified_at;


        const rejectionReason =
            normalize(
                item?.mentor_rejection_reason
            );


        return `

            <div class="col-12">

                <article class="card history-card">

                    <div class="card-body p-4">


                        <!-- CARD HEADER -->

                        <div class="d-flex
                                    flex-column
                                    flex-md-row
                                    justify-content-between
                                    gap-3
                                    mb-3">

                            <div>

                                <div class="small-muted mb-1">
                                    Outpass ID
                                </div>

                                <h2 class="h5 mb-0">

                                    ${escapeHtml(
                                        item?.outpass_id || "—"
                                    )}

                                </h2>

                            </div>


                            <div class="align-self-start">

                                ${statusMarkup(item)}

                            </div>

                        </div>


                        <!-- OUTPASS DETAILS -->

                        <div class="row g-3 mb-3">

                            ${infoBlock(
                                "Student",
                                item?.student_name
                            )}

                            ${infoBlock(
                                "Roll Number",
                                item?.roll_number
                            )}

                            ${infoBlock(
                                "Year",
                                item?.year
                            )}

                            ${infoBlock(
                                "Destination",
                                item?.destination
                            )}

                            ${infoBlock(
                                "Outpass Date",
                                formatDate(
                                    item?.outpass_date
                                )
                            )}

                            ${infoBlock(
                                "Exit Time",
                                formatTime(
                                    item?.exit_time
                                )
                            )}

                            ${infoBlock(
                                "Return Date",
                                formatDate(
                                    item?.return_date
                                )
                            )}

                            ${infoBlock(
                                "Submitted",
                                formatDateTime(
                                    item?.submitted_at
                                )
                            )}

                        </div>


                        <!-- REASON -->

                        <div class="reason-box mb-3">

                            <div class="info-label">
                                Reason
                            </div>

                            <div class="info-value">

                                ${escapeHtml(
                                    item?.reason ||
                                    "No reason provided."
                                )}

                            </div>

                        </div>


                        <!-- PARENT VERIFICATION -->

                        ${parentVerifiedAt ? `

                            <div class="otp-box mb-3">

                                <div class="d-flex gap-2">

                                    <i class="bi bi-shield-check
                                              text-success
                                              fs-5">
                                    </i>

                                    <div>

                                        <div class="fw-semibold">
                                            Parent verification
                                        </div>

                                        <div class="small-muted">

                                            Verified at
                                            ${escapeHtml(
                                                formatDateTime(
                                                    parentVerifiedAt
                                                )
                                            )}

                                        </div>

                                    </div>

                                </div>

                            </div>

                        ` : ""}


                        <!-- REJECTION REASON -->

                        ${!approved && rejectionReason ? `

                            <div class="rejection-box mb-3">

                                <div class="info-label text-danger">
                                    Mentor rejection reason
                                </div>

                                <div class="info-value">

                                    ${escapeHtml(
                                        rejectionReason
                                    )}

                                </div>

                            </div>

                        ` : ""}


                        <!-- FOOTER -->

                        <div class="d-flex
                                    flex-column
                                    flex-sm-row
                                    justify-content-between
                                    gap-2
                                    pt-2
                                    border-top">

                            <div class="small-muted">

                                <i class="bi bi-person-check me-1"></i>

                                Mentor decision:

                                ${escapeHtml(
                                    formatDateTime(
                                        decisionTime
                                    )
                                )}

                            </div>


                            <div class="small-muted">

                                <i class="bi bi-info-circle me-1"></i>

                                Overall status:

                                ${escapeHtml(
                                    item?.overall_status || "—"
                                )}

                            </div>

                        </div>

                    </div>

                </article>

            </div>

        `;

    }


    /* =========================================================
       APPLY FILTERS
       ========================================================= */

    function applyFilters() {

        const status =
            elements.statusFilter.value;

        const query =
            normalize(
                elements.searchInput.value
            ).toLowerCase();


        let filtered =
            allHistory;


        if (status === "approved") {

            filtered =
                filtered.filter(isApproved);

        }

        else if (status === "rejected") {

            filtered =
                filtered.filter(isRejected);

        }


        if (query) {

            filtered =
                filtered.filter(item =>
                    searchableText(item)
                        .includes(query)
                );

        }


        renderStats(filtered);


        if (filtered.length === 0) {

            elements.historyContainer
                .classList.add("d-none");

            elements.emptyState
                .classList.remove("d-none");


            elements.emptyMessage.textContent =

                allHistory.length === 0

                    ? "There are no approved or rejected outpasses across departments yet."

                    : "No approved or rejected outpasses match the selected filters.";

            return;

        }


        elements.emptyState
            .classList.add("d-none");


        elements.historyContainer
            .classList.remove("d-none");


        elements.historyContainer.innerHTML =
            filtered.map(renderCard).join("");

    }


    /* =========================================================
       FETCH HISTORY FROM BACKEND
       ========================================================= */

    async function fetchHistory() {

        const token =
            getToken();


        if (!token) {

            logout();

            return;

        }


        hideAlert();


        elements.loadingState
            .classList.remove("d-none");


        elements.historyContainer
            .classList.add("d-none");


        elements.emptyState
            .classList.add("d-none");


        try {

            const response =
                await fetch(
                    `${API_URL}/api/outpasses`,
                    {
                        method: "GET",

                        headers: {

                            "Accept":
                                "application/json",

                            "Authorization":
                                `Bearer ${token}`

                        },

                        cache: "no-store"

                    }
                );


            let result = null;


            try {

                result =
                    await response.json();

            }

            catch (_) {

                result = null;

            }


            /* SESSION EXPIRED */

            if (
                response.status === 401 ||
                response.status === 403
            ) {

                logout();

                return;

            }


            /* SERVER ERROR */

            if (!response.ok) {

                throw new Error(

                    normalize(
                        result?.message
                    ) ||

                    `Server returned HTTP ${response.status}.`

                );

            }


            /* API REPORTED FAILURE */

            if (result?.success === false) {

                throw new Error(

                    normalize(
                        result?.message
                    ) ||

                    "Unable to load outpass history."

                );

            }


            /* PROCESS HISTORY */

            allHistory =
                normalizeHistory(
                    getHistoryArray(result)
                );


            applyFilters();

        }


        catch (error) {

            console.error(
                "History loading error:",
                error
            );


            allHistory = [];


            renderStats([]);


            elements.historyContainer
                .classList.add("d-none");


            elements.emptyState
                .classList.add("d-none");


            showAlert(

                `Unable to load history. ${
                    error.message ||
                    "Please make sure the backend is running."
                }`

            );

        }


        finally {

            elements.loadingState
                .classList.add("d-none");

        }

    }


    /* =========================================================
       INITIALIZE MENTOR
       ========================================================= */

    function initializeUser() {

        const token =
            getToken();


        currentUser =
            getStoredUser();


        if (
            !token ||
            !currentUser
        ) {

            logout();

            return false;

        }


        const role =
            getRole(currentUser);


        if (
            role &&
            role !== "mentor"
        ) {

            alert(
                "Access denied. This page is available only to mentors."
            );

            logout();

            return false;

        }


        elements.mentorName.textContent =

            normalize(
                currentUser.name ||
                currentUser.full_name ||
                currentUser.username
            ) ||

            "Mentor";


        elements.mentorEmployeeId.textContent =

            `Employee ID: ${
                normalize(
                    currentUser.employee_id ||
                    currentUser.employeeId ||
                    currentUser.emp_id ||
                    currentUser.username
                ) || "—"
            }`;


        return true;

    }


    /* =========================================================
       EVENT LISTENERS
       ========================================================= */

    elements.statusFilter.addEventListener(
        "change",
        applyFilters
    );


    elements.searchInput.addEventListener(
        "input",
        applyFilters
    );


    elements.clearFiltersBtn.addEventListener(
        "click",
        () => {

            elements.statusFilter.value =
                "all";

            elements.searchInput.value =
                "";

            applyFilters();

        }
    );


    elements.refreshBtn.addEventListener(
        "click",
        fetchHistory
    );


    elements.logoutBtn.addEventListener(
        "click",
        logout
    );


    /* =========================================================
       START PAGE
       ========================================================= */

    if (initializeUser()) {

        fetchHistory();

    }

})();

</script>

</body>
</html>
